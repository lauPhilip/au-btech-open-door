name: Feature
description: Something students or teachers should be able to do
labels: ["feature"]
body:
  - type: textarea
    id: story
    attributes:
      label: User story
      value: "As a … I want … so that …"
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: How will we know it works? Short, testable statements.
      value: "- [ ] "
    validations:
      required: true
  - type: input
    id: board
    attributes:
      label: Concept book board (optional)
      placeholder: "10"
