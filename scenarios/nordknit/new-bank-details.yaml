# Open Door scenario
# Content licence: CC BY-SA 4.0 — see LICENSE-CONTENT.md
# Builds on the CyPro method from the Digital Business Development toolbox (https://dbd.au.dk).
# Everything in this file is fictional. Nordknit is inspired by family-owned textile
# businesses in the Herning area and does not describe any real company's security.
# Second bad day at Nordknit. Same site and same people as "Black Friday".

id: nordknit-new-bank-details
format: 1
title: New bank details
lengths: [45, 90]

company:
  id: nordknit
  name: Nordknit
  place: Sunds, Denmark
  fictional: true
  summary: >-
    A family-owned clothing company in its fourth generation. The office,
    the warehouse and the dye works share one site in Sunds. A sewing
    factory in Lithuania makes the clothes. Customers in nine countries
    buy them in the company's own webshops.

learning_goals:
  - Find the data and the money a small company depends on.
  - See how a trusted message can be fake.
  - Name what could go wrong, who could cause it and how likely it is.
  - Compare your team's view with what really happened.

goal: The factory says Nordknit has not paid. Find out how the money went missing.

story:
  - speaker: karin
    text: Welcome back to Nordknit. This morning the factory in Lithuania called me.
  - speaker: karin
    text: They say we have not paid their big invoice. But Elena says she paid it yesterday.
  - speaker: karin
    text: Both of them are telling the truth. That worries me more than a simple mistake.
  - speaker: karin
    text: Please walk around. Talk to my people. Tell me what could go wrong.

# ---------------------------------------------------------------- the map
map:
  width: 1206
  height: 770
  rooms:
    - { id: webshop,    name: Webshop team,    rect: [16, 16, 380, 250],   zone: office }
    - { id: accounting, name: Accounting,      rect: [404, 16, 250, 250],  zone: office }
    - { id: ceo,        name: CEO office,      rect: [662, 16, 200, 250],  zone: office }
    - { id: meeting,    name: Meeting room,    rect: [870, 16, 336, 250],  zone: office, start: true }
    - { id: reception,  name: Reception,       rect: [16, 338, 270, 200],  zone: guest }
    - { id: server,     name: Server cupboard, rect: [294, 338, 140, 200], zone: office }
    - { id: packing,    name: Packing station, rect: [16, 546, 418, 220],  zone: warehouse }
    - { id: warehouse,  name: Warehouse,       rect: [442, 338, 540, 428], zone: warehouse }
    - { id: dock,       name: Loading dock,    rect: [990, 338, 216, 428], zone: guest }

  # Zones are the trust boundaries. Places outside the building are zones too.
  zones:
    - { id: office,    name: Office network,    inside: true }
    - { id: warehouse, name: Warehouse network, inside: true }
    - { id: guest,     name: Guest Wi-Fi,       inside: true }
    - { id: cloud,     name: Webshop provider,  inside: false }
    - { id: shipping,  name: Shipping partner,  inside: false }
    - { id: factory,   name: "Sewing factory, Lithuania", inside: false }

# ---------------------------------------------------------------- people
people:
  - id: karin
    name: Karin
    role: CEO, fourth generation
    room: ceo
    hello: The factory is angry. Without their clothes we have nothing to sell.
    topics:
      - ask: How big is the invoice?
        answer: Forty-eight thousand euro. It is the biggest payment of the autumn.
        reveals: [payments]
      - ask: Who checks a payment before it goes?
        answer: Nobody. Elena has done it for years, so I trust her. I never look.
        reveals: [payments]

  - id: mei
    name: Mei
    role: Webshop manager
    room: webshop
    hello: I only sell the clothes. The money side is Elena's world.
    topics:
      - ask: Do you hear from the factory?
        answer: Sometimes. They write to the shared team address, and we pass it on to Elena.
        reveals: [mailbox]

  - id: ahmed
    name: Ahmed
    role: Part-time IT
    room: server
    hello: I'm here on Mondays and Thursdays. Today is Monday, so you are lucky.
    topics:
      - ask: How is the accounting mailbox protected?
        answer: With a password. Elena chose it herself. We talked about a second step, but never did it.
        reveals: [mailbox]
      - ask: What is in this cupboard?
        answer: The router, the Wi-Fi and a backup disk. The door lock broke in the summer.
        reveals: [backup, network]

  - id: jana
    name: Jana
    role: Packing lead
    room: packing
    hello: Half of our new stock is stuck at the factory. I'm not happy.
    topics:
      - ask: What happens if the factory stops sending clothes?
        answer: We run out of the best sellers in two weeks. Then the packing line stands still.
        reveals: [payments]

  - id: elena
    name: Elena
    role: Accounting
    room: accounting
    hello: I paid it yesterday. I even have the receipt from the bank.
    topics:
      - ask: Why did you pay it yesterday?
        answer: The factory wrote that their bank had changed. They asked me to use the new account before Tuesday.
        reveals: [payments, mailbox]
      - ask: Did you check the new account with anyone?
        answer: I answered the e-mail and they confirmed it. There was no reason to doubt it.
        reveals: [payments]
      - ask: What do you do with paper invoices?
        answer: They go in the tray on my desk. I take them home on Fridays when I need peace.
        reveals: [payments]

  - id: tomas
    name: Tomas
    role: Driver, shipping partner
    room: dock
    hello: Morning. Same route as always. A few letters for the office today.
    topics:
      - ask: Who takes the post?
        answer: I leave it at reception. If nobody is there, I put it on the desk in accounting.
        reveals: [payments]

# ---------------------------------------------------------------- things
things:
  - id: invoice-tray
    name: Invoice tray
    room: accounting
    text: Paper and e-mail invoices waiting to be paid. On top lies the factory's big invoice.
    closer: The invoice carries the bank account. Nobody compares it with an earlier invoice.

  - id: mail-screen
    name: Accounting inbox
    room: accounting
    text: Elena's e-mail. The newest message is from "the factory", about new bank details.
    closer: The sender address is nordknit-factory.com. The factory's real address ends in .lt.

  - id: visitor-book
    name: Visitor book
    room: reception
    text: Visitors write their name and the time. Reception is empty before 8:30.

  - id: router
    name: Router and Wi-Fi
    room: server
    text: Connects the office, the warehouse and the guest Wi-Fi to the internet.
    closer: The accounting mailbox has no second step when someone logs in from a new country.

  - id: order-screen
    name: Live order screen
    room: webshop
    text: Shows orders from all nine shops as they come in.

# ---------------------------------------------------------------- assets
assets:
  - { id: orders,          name: Customer orders,           lives_in: [cloud, webshop] }
  - { id: payments,        name: Supplier payments,         lives_in: [accounting, factory] }
  - { id: mailbox,         name: Accounting mailbox,        lives_in: [cloud, accounting] }
  - { id: backup,          name: Backup of company files,   lives_in: [server] }
  - { id: network,         name: Company networks,          lives_in: [server] }

flows:
  - { from: factory, to: accounting, carries: [payments] }
  - { from: cloud,   to: accounting, carries: [mailbox] }
  - { from: cloud,   to: webshop,    carries: [orders] }

# ---------------------------------------------------------------- reference threats
threats:
  - id: fake-bank-details
    target: mail-screen
    text: A fake e-mail from "the factory" with new bank details was paid without a second check.
    harm: [change]
    actor: [online]
    likelihood: 4
    stride: [spoofing]

  - id: single-approver
    target: invoice-tray
    text: One person can pay any invoice alone. Nobody looks at the big ones.
    harm: [change]
    actor: [online, employee]
    likelihood: 3
    stride: [repudiation, elevation-of-privilege]

  - id: mailbox-password
    target: router
    text: The accounting mailbox has only a password. Someone who guesses it can read and send mail as Elena.
    harm: [leak, change]
    actor: [online]
    likelihood: 3
    stride: [spoofing, information-disclosure]

  - id: loose-paper-invoices
    target: invoice-tray
    text: Paper invoices with bank details lie open on a desk. A visitor could copy or swap them.
    harm: [leak, change]
    actor: [visitor, employee]
    likelihood: 2
    stride: [information-disclosure, tampering]

  - id: empty-reception
    target: visitor-book
    text: Reception is empty before 8:30, so a visitor can walk to the accounting desk.
    harm: [leak, change]
    actor: [visitor]
    likelihood: 2
    stride: [spoofing]

  - id: open-server-cupboard
    target: router
    text: The server cupboard is unlocked. Someone could take the backup disk or unplug the network.
    harm: [leak, stop]
    actor: [visitor, employee]
    likelihood: 2
    stride: [information-disclosure, denial-of-service]

# ---------------------------------------------------------------- the day
day:
  name: Monday, the day after the payment
  starts: "08:00"
  ends: "10:00"
  minutes_per_game_minute: 0.25
  alert: The factory says the invoice is not paid.
  problems: [fake-bank-details, single-approver, mailbox-password]

  events:
    - { at: "08:10", from: karin, text: "The factory manager is calling me again. He sounds upset." }
    - { at: "08:40", from: elena, text: "The bank receipt says the money went to an account in another country." }
    - { at: "09:10", from: ahmed, text: "I looked at the mailbox log. Someone logged in from Romania last week." }
    - { at: "09:40", from: jana,  text: "The factory has stopped our next delivery until they get paid." }

  clues:
    - { room: accounting, text: "The bank receipt shows an account in Romania. The factory's usual account is in Lithuania.", points_to: fake-bank-details }
    - { room: ceo,        text: "Karin: the factory says it never asked to change its bank details.", points_to: single-approver }
    - { room: server,     text: "Mailbox log: a login from Romania, six days ago at 06:12.", points_to: mailbox-password }
    - { room: reception,  text: "Visitor book: 'Courier, letter for Elena, 07:50'. Reception was empty then.", points_to: empty-reception }

  final_choice:
    question: Karin asks — the money left yesterday. What do we do right now?
    options:
      - text: Reply to the e-mail and ask if the new bank details are real.
        result: The reply comes back in minutes and says yes. It is the same person who sent the fake. The money is gone.
        score: 1
      - text: Call the bank to stop the payment, then call the factory on its old number.
        result: The bank can stop part of the payment. The factory confirms the e-mail was fake. Elena changes the mailbox password.
        score: 3
        best: true
      - text: Pay the invoice again to the factory's old account.
        result: The factory ships again. But Nordknit has paid 48,200 euro twice, and the first payment is still lost.
        score: 2

# ---------------------------------------------------------------- debrief
debrief:
  prompts:
    - Which team found the Romanian account first? Which room gave it away?
    - Elena did her job as she always does. Which small change would have stopped this?
    - Several teams missed the mailbox password. Why is it easy to miss?
    - If you could fix only one note before next month, which one, and why?
  next_class: Risk management — which risk would you treat first, and what would it cost?
