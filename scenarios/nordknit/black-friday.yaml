# Open Door scenario
# Content licence: CC BY-SA 4.0 — see LICENSE-CONTENT.md
# Builds on the CyPro method from the Digital Business Development toolbox (https://dbd.au.dk).
# Everything in this file is fictional. Nordknit is inspired by family-owned textile
# businesses in the Herning area and does not describe any real company's security.

id: nordknit-black-friday
format: 1
title: Black Friday
lengths: [45, 90]

company:
  id: nordknit
  name: Nordknit
  place: Sunds, Denmark
  fictional: true
  summary: >-
    A family-owned clothing company in its fourth generation. The office,
    the warehouse and the dye works share one site in Sunds. A sewing
    factory in Lithuania makes the clothes. Customers in nine countries
    buy them in the company's own webshops.

learning_goals:
  - Find the data a small company depends on.
  - See where data leaves the company's control.
  - Name what could go wrong, who could cause it and how likely it is.
  - Compare your team's view with what really happened.

goal: Black Friday is in 3 days. Find what could stop an order reaching a customer.

story:
  - speaker: karin
    text: Welcome to Nordknit. My great-grandfather started this company with one knitting machine.
  - speaker: karin
    text: Black Friday is in three days. We expect ten times more orders than on a normal day.
  - speaker: karin
    text: Last year a small problem cost us a whole day of shipping. I can't let that happen again.
  - speaker: karin
    text: Please walk around. Talk to my people. Tell me what could go wrong.

# ---------------------------------------------------------------- the map
map:
  width: 1206
  height: 770
  rooms:
    - { id: webshop,    name: Webshop team,    rect: [85, 54, 379, 238],   zone: office }
    - { id: accounting, name: Accounting,      rect: [469, 54, 217, 238],  zone: office }
    - { id: ceo,        name: CEO office,      rect: [690, 54, 201, 238],  zone: office }
    - { id: meeting,    name: Meeting room,    rect: [897, 54, 219, 273],  zone: office, start: true }
    - { id: reception,  name: Reception,       rect: [90, 332, 238, 139],  zone: guest }
    - { id: server,     name: Server cupboard, rect: [330, 332, 77, 137], zone: office }
    - { id: packing,    name: Packing station, rect: [90, 475, 379, 211],  zone: warehouse }
    - { id: warehouse,  name: Warehouse,       rect: [469, 333, 362, 353], zone: warehouse }
    - { id: dock,       name: Loading dock,    rect: [895, 333, 221, 353], zone: guest }

  # Zones are the trust boundaries. Places outside the building are zones too.
  zones:
    - { id: office,    name: Office network,    inside: true }
    - { id: warehouse, name: Warehouse network, inside: true }
    - { id: guest,     name: Guest Wi-Fi,       inside: true }
    - { id: cloud,     name: Webshop provider,  inside: false }
    - { id: shipping,  name: Shipping partner,  inside: false }
    - { id: factory,   name: "Sewing factory, Lithuania", inside: false }

# ---------------------------------------------------------------- people
people:
  - id: karin
    name: Karin
    role: CEO, fourth generation
    room: ceo
    hello: I care about one thing this week. Every parcel must leave on time.
    topics:
      - ask: What would hurt the company most?
        answer: Losing our customers' trust. People buy from us because we are honest and reliable.
        reveals: [customer-data, orders]
      - ask: Who can pay invoices?
        answer: Elena in accounting. She has done it for years, so she does it alone.
        reveals: [payments]

  - id: mei
    name: Mei
    role: Webshop manager
    room: webshop
    hello: Nine shops, one system. On Black Friday it gets very busy.
    topics:
      - ask: Where does the webshop run?
        answer: A provider hosts it for us. We log in to a web page to manage it.
        reveals: [orders, admin-login]
      - ask: Who can log in as admin?
        answer: All four of us share one admin login. The password is on a note under my keyboard.
        reveals: [admin-login]
      - ask: What happens when there are many visitors?
        answer: Last Black Friday the shop was slow for two hours. We never found out why.
        reveals: [orders]

  - id: ahmed
    name: Ahmed
    role: Part-time IT
    room: server
    hello: I'm here on Mondays and Thursdays. The rest of the week the IT runs itself. Mostly.
    topics:
      - ask: What is in this cupboard?
        answer: The router, the Wi-Fi and a backup disk. The door lock broke in the summer.
        reveals: [backup, network]
      - ask: How many networks do you have?
        answer: Office, warehouse and guest Wi-Fi. Drivers use the guest one when they wait.
        reveals: [network]

  - id: jana
    name: Jana
    role: Packing lead
    room: packing
    hello: Orders come in, labels come out, parcels go on the truck. That's my day.
    topics:
      - ask: How do labels get printed?
        answer: The printer gets them straight from the webshop. IT put it on the guest Wi-Fi — it was easier for the drivers too.
        reveals: [shipping-labels]
      - ask: What if the printer stops?
        answer: Then nothing ships. The truck leaves at ten, with or without our parcels.
        reveals: [orders]

  - id: elena
    name: Elena
    role: Accounting
    room: accounting
    hello: Invoices, salaries, suppliers. If it costs money, it passes my desk.
    topics:
      - ask: How do you pay the factory?
        answer: They e-mail an invoice and I pay it. If their bank details change, they write to me.
        reveals: [payments]

  - id: tomas
    name: Tomas
    role: Driver, shipping partner
    room: dock
    hello: Morning. I just need the parcels and a coffee.
    topics:
      - ask: How do you get into the building?
        answer: The dock door is open in the morning. Nobody really checks. Everybody knows me.
        reveals: [network]

# ---------------------------------------------------------------- things
things:
  - id: label-printer
    name: Label printer
    room: packing
    text: Prints shipping labels for every order. A small screen shows its status.
    closer: Its admin page opens from any device on the guest Wi-Fi. The password is the factory default.

  - id: order-screen
    name: Live order screen
    room: webshop
    text: Shows orders from all nine shops as they come in.
    closer: Orders arrive from the webshop provider over the internet.

  - id: router
    name: Router and Wi-Fi
    room: server
    text: Connects the office, the warehouse and the guest Wi-Fi to the internet.
    closer: The guest and warehouse networks are not separated. Any guest device can reach the printer.

  - id: visitor-book
    name: Visitor book
    room: reception
    text: Visitors write their name and the time. Reception is empty before 8:30.

  - id: invoice-tray
    name: Invoice tray
    room: accounting
    text: Paper and e-mail invoices waiting to be paid.

# ---------------------------------------------------------------- assets
# Assets are data. The game calls them "things worth protecting".
assets:
  - { id: orders,          name: Customer orders,           lives_in: [cloud, webshop] }
  - { id: customer-data,   name: Customer names and addresses, lives_in: [cloud, webshop, packing] }
  - { id: shipping-labels, name: Shipping labels,           lives_in: [packing, shipping] }
  - { id: admin-login,     name: Webshop admin login,       lives_in: [webshop] }
  - { id: payments,        name: Supplier payments,         lives_in: [accounting] }
  - { id: backup,          name: Backup of company files,   lives_in: [server] }
  - { id: network,         name: Company networks,          lives_in: [server] }

# Data flows. A flow that goes between two zones crosses a trust boundary.
flows:
  - { from: cloud,     to: webshop,  carries: [orders, customer-data] }
  - { from: cloud,     to: packing,  carries: [orders, customer-data], via: guest }
  - { from: packing,   to: shipping, carries: [shipping-labels] }
  - { from: factory,   to: accounting, carries: [payments] }

# ---------------------------------------------------------------- reference threats
# The teacher's answer key. Students never see this list during play.
# harm: leak (confidentiality), change (integrity), stop (availability)
# actor: online, visitor, employee, supplier, accident
# likelihood: CyPro's four steps — 1 in theory, 2 elsewhere, 3 companies like us, 4 happened here
threats:
  - id: printer-guest-wifi
    target: label-printer
    text: Anyone on the guest Wi-Fi can change or stop the label printer.
    harm: [change, stop]
    actor: [visitor]
    likelihood: 3
    stride: [tampering, denial-of-service]

  - id: fake-visitor
    target: visitor-book
    text: A stranger can walk in before reception opens and pretend to be a technician.
    harm: [leak, change]
    actor: [visitor]
    likelihood: 2
    stride: [spoofing]

  - id: webshop-overload
    target: order-screen
    text: The webshop can slow down or stop under ten times the normal traffic.
    harm: [stop]
    actor: [accident, online]
    likelihood: 4
    stride: [denial-of-service]

  - id: shared-admin-password
    target: order-screen
    text: The admin login is shared and written on a note. Anyone could change prices or steal customer data. Nobody would know who did it.
    harm: [leak, change]
    actor: [employee, visitor]
    likelihood: 3
    stride: [spoofing, repudiation, elevation-of-privilege]

  - id: open-server-cupboard
    target: router
    text: The server cupboard is unlocked. Someone could take the backup disk or unplug the network.
    harm: [leak, stop]
    actor: [visitor, employee]
    likelihood: 2
    stride: [information-disclosure, denial-of-service]

  - id: fake-bank-details
    target: invoice-tray
    text: A fake e-mail from "the factory" with new bank details could be paid without a second check.
    harm: [change]
    actor: [online]
    likelihood: 3
    stride: [spoofing]

# ---------------------------------------------------------------- the day
day:
  name: Friday, Black Friday
  starts: "07:55"
  ends: "10:00"
  minutes_per_game_minute: 0.25
  alert: Orders have stopped printing.
  problems: [printer-guest-wifi, fake-visitor, webshop-overload]

  events:
    - { at: "08:04", from: mei,   text: "The shop is up and orders come in. But nothing has printed since 07:52!" }
    - { at: "08:20", from: jana,  text: 'The printer screen says "paused by admin". None of us did that.' }
    - { at: "08:45", from: mei,   text: "The German shop is slow now. Customers are writing to support." }
    - { at: "09:30", from: tomas, text: "Truck leaves at ten. How many parcels do I get?" }

  clues:
    - { room: webshop,   text: "2,300 orders are waiting. The shop works, but labels don't print.", points_to: printer-guest-wifi }
    - { room: packing,   text: 'The printer says "paused by admin". Its settings were changed at 07:51.', points_to: printer-guest-wifi }
    - { room: server,    text: "Router log: a new device joined the guest Wi-Fi at 07:48.", points_to: printer-guest-wifi }
    - { room: reception, text: "Visitor book: 'Printer service, 07:40'. Nobody booked a printer service.", points_to: fake-visitor }

  final_choice:
    question: Karin asks — what do we do right now?
    options:
      - text: Restart the printer and get back to packing.
        result: Labels print again at 09:10. At 09:25 the printer is paused again.
        score: 1
      - text: Take the printer off the guest Wi-Fi, change its password, then check the visitor book.
        result: Labels print from 09:05. The truck leaves full at 10:00.
        score: 3
        best: true
      - text: Close the webshop until IT has checked everything.
        result: Nothing more goes wrong — but no orders come in during the biggest sales day of the year.
        score: 2

# ---------------------------------------------------------------- debrief
debrief:
  prompts:
    - Which team spotted the printer on the guest Wi-Fi? What made you look there?
    - The fake visitor came in before reception opened. Which room should you have visited to see this coming?
    - Several teams missed the shared admin password. Why is it easy to miss?
    - If you could fix only one note before next Black Friday, which one, and why?
  next_class: Risk management — which risk would you treat first, and what would it cost?
